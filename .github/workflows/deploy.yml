name: Deploy Frontend

on:
  push:
    branches: [main]

# concurrency:
#   group: deploy-frontend
#   cancel-in-progress: true

env:
  # Path to the library-app checkout on the VM (contains docker-compose.yml
  # and this repo checked out as the "frontend_library" submodule).
  DEPLOY_PATH: /home/trong/library-app

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo -v --redact --exit-code 0

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan dependencies for known vulnerabilities (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true

  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image for scanning
        run: docker build -t frontend:ci .

      - name: Scan image for known vulnerabilities (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: frontend:ci
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true

  deploy:
    needs: [gitleaks, trivy-fs, trivy-image]
    runs-on: [self-hosted, frontend-library]
    steps:
      - name: Pull latest frontend_library code
        run: |
          set -e
          cd "$DEPLOY_PATH/frontend_library"
          git fetch origin main
          git reset --hard origin/main

      - name: Rebuild and restart frontend service only
        run: |
          set -e
          cd "$DEPLOY_PATH"
          docker compose build frontend
          docker compose up -d frontend

      - name: Prune dangling images
        run: docker image prune -f
